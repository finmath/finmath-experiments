name: Build & Release (tag)

on:
  push:
    tags:
      - 'v*'                    # For tags with format v1.2.3 nutzt
      - 'finmath-experiments-*' # Maven Release Plugin Default: <artifactId>-<version>

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # OS-Tools, die jpackage erwartet
      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Install WiX (Windows)
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Build with Maven (skip tests)
        run: mvn -B -DskipTests package

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: target/dist/**
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: dist-*
          merge-multiple: true

      - name: Create GitHub Release for tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-msi:
    name: Build & Package (Windows, MSI + debug, clean input)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Accept preinstalled/newer WiX; just ensure it's on PATH
      - name: Ensure WiX available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          choco install wixtoolset --version=3.14.1 -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Host "Using preinstalled WiX."; }
          $wixRoot = Get-ChildItem -Path "C:\Program Files (x86)\" -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if ($wixRoot) {
            $wixBin = Join-Path $wixRoot.FullName "bin"
            $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append
            where.exe light.exe
            where.exe candle.exe
          } else { Write-Error "WiX not found"; exit 1 }

      - name: Tool versions
        shell: pwsh
        run: |
          mvn -version
          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          jpackage --version

      - name: Build (debug)
        run: mvn -B -e -X -DskipTests clean package

      # Copy runtime dependencies into a separate folder (no target/classes/)
      - name: Prepare clean jpackage input
        shell: pwsh
        run: |
          mvn -B -q -DincludeScope=runtime -DoutputDirectory=target\jpdeps dependency:copy-dependencies
          $finalName = mvn -q -DforceStdout help:evaluate -Dexpression=project.build.finalName
          $version   = mvn -q -DforceStdout help:evaluate -Dexpression=project.version
          $artifact  = mvn -q -DforceStdout help:evaluate -Dexpression=project.artifactId
          "APP_JAR=$finalName.jar" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_VERSION=$version"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_NAME=$artifact"     | Out-File -FilePath $env:GITHUB_ENV -Append

          New-Item -ItemType Directory -Force -Path target\jpinput | Out-Null
          Copy-Item "target\$finalName.jar" target\jpinput\
          Copy-Item "target\jpdeps\*.jar"   target\jpinput\ -Force

      # Run jpackage directly with the clean input; let it jlink a runtime
      - name: jpackage MSI (verbose, fixed temp)
        shell: pwsh
        run: |
          $temp = "D:\a\_wix_tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          jpackage `
            --name "$env:APP_NAME" `
            --type msi `
            --app-version "$env:APP_VERSION" `
            --dest "target\dist" `
            --input "target\jpinput" `
            --main-jar "$env:APP_JAR" `
            --main-class "net.finmath.experiments.ui.StartUI" `
            --vendor "finmath.net" `
            --verbose `
            --temp "$temp"

      - name: Upload installers (MSI/EXE)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            **\target\dist\*.msi
            **\target\dist\*.exe
          if-no-files-found: warn

      - name: Upload WiX & jpackage temps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wix-and-jpackage-temp
          path: |
            D:\a\_wix_tmp\**
            **\jdk.jpackage*\wixobj\**
            **\jdk.jpackage*\*.wxs
            **\jdk.jpackage*\*.wixpdb
            **\jdk.jpackage*\*.wixobj
            **\images\win-msi.image\**
          if-no-files-found: ignore

      - name: Upload Maven logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-logs
          path: |
            **\mvn*.log
            **\build.log
            **\surefire-reports\**
          if-no-files-found: ignore

